services:
  aowow:
    build:
      dockerfile: Dockerfile
      target: php-prod
      context: .
    env_file:
      - path: .env.aowow
        required: true
    networks:
      default:
        ipv4_address: 172.28.0.10

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
